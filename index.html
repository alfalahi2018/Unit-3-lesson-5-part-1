function scr(){S.st[S.step].sh=!S.st[S.step].sh;render()}
function wd(k){const s=S.st[1];s.seen[k]=1;s.sc=Object.keys(s.seen).length;tone([660,880],.1);say(V[k][0]);render()}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();if(q.w)say(q.w);render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){S.st[S.step]=nst();tone([440,523],.1);render()}
function cl(g,i){const s=S.st[CL];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[CL];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s.slice(0,CL).reduce((x,y)=>x+y.sc,0)+(s[CL].chk?C.a.filter((a,g)=>s[CL].ans[g]===a).length:0)}
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="q" style="text-align:center;font-size:56px;color:#E8553D">'+s.sc+' / '+n+'</div><div class="fb" style="text-align:center">'+(s.sc===n?'Excellent! Fantastic work!':s.sc>=n-2?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<CL?'<button class="go" onclick="go('+(S.step+1)+')">Next part →</button>':'')+'</div></div>';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 const pic=q.p?'<div class="big">'+ic(q.p,120)+'</div>':'';
 const lb=q.pics?'<div class="row" style="justify-content:center"><button class="go alt" onclick="lis()">▶ Listen</button></div>':'';
 const au=a.lines?'<div class="row" style="justify-content:flex-start"><button class="go alt" style="padding:8px 24px;font-size:18px" onclick="play()">▶ Listen</button><button class="go" style="padding:8px 24px;font-size:18px" onclick="scr()">'+(s.sh?'Hide':'Show')+' the script</button></div>'+(s.sh?'<div class="scr">'+a.lines.map(l=>'<b>'+l[0]+':</b> '+l[1]).join('<br>')+'</div>':''):'';
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Stars: '+s.sc+'</span></div>'+au+pic+'<div class="q">'+pr+'</div>'+lb+'<div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')">'+(q.pics?ic(o.p,90):'<span>'+o.t+'</span>')+'</button>').join('')+'</div><div class="fb">'+(lk?(ok?'Great job! ':'Not quite. ')+'The answer is: '+(q.w||q.o[q.a].t)+'. '+(q.ex||''):'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 if(a.type==='words')return '<div class="card"><h2>'+a.n+' · '+a.min+' min — Tap, listen and repeat!</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">'+V.map((v,k)=>'<button class="sc'+(s.seen[k]?' on':'')+'" onclick="wd('+k+')">'+ic(v[1],64)+v[0]+'</button>').join('')+'</div><div class="fb">Words heard: '+s.sc+' / 12</div><button class="go alt" onclick="go(2)">Match →</button></div>';
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card"><div class="meta"><span>Finishing the lesson · Vocabulary / Grammar</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i))+'</div>'+C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i,cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('')+'<div class="row"><b style="font-size:26px;color:#E8553D;margin-right:auto">'+(s.chk?'Score: '+n+' / 5':'')+'</b><span>'+(s.chk?(n===5?'Excellent!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'Answer all 5 items, then press Check.')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit">Created by T.Badria Alfalahi</div></div>'}
function render(){document.getElementById('nav').innerHTML='<span>Start with any part:</span>'+A.map((a,k)=>'<button class="'+(k===S.step?'on':'')+'" onclick="go('+k+')">'+a.n+'</button>').join('');document.getElementById('stars').textContent='Stars: '+stars();document.getElementById('main').innerHTML=view()}
render();
</script></body></html>
